<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INNO · 云端图片审核</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#20312d;background:#f3f5f2}body{margin:0}header{background:#173a32;color:white;padding:28px max(24px,calc((100vw - 1200px)/2))}h1{font-size:28px;margin:6px 0}header p{color:#c6dbd2;margin:4px 0}main{max-width:1200px;margin:24px auto;padding:0 20px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}button,select{font:inherit;border:1px solid #bdcdc5;border-radius:6px;background:#fff;padding:9px 15px;cursor:pointer}button.approve{background:#236149;color:white}button:disabled{opacity:.45;cursor:default}.stats{padding:15px 20px;background:#e2ebe5;border-radius:9px}article{background:white;border:1px solid #dce5de;border-radius:10px;padding:22px;margin:20px 0}h2{font-size:18px;margin:0 0 6px;overflow-wrap:anywhere}.badge{color:#7d5605;background:#fff1ca;padding:3px 9px;border-radius:4px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}figure{margin:0}figcaption{font-weight:650;margin-bottom:8px}img{width:100%;height:auto;display:block;background:#e9eee9}small{color:#65776b}.error{color:#ad3030}.empty{padding:60px;text-align:center}footer{display:flex;gap:15px;justify-content:center;padding:20px}.placeholder{background:#eef1ee;min-height:180px;display:grid;place-items:center;padding:20px}label{display:flex;gap:8px;align-items:flex-start;margin:14px 0}input{margin-top:6px}@media(max-width:700px){.pair{grid-template-columns:1fr}header{padding:22px}article{padding:15px}}
img{height:200px;object-fit:contain;cursor:zoom-in}article{padding:16px;margin:12px 0}.pair{gap:12px;margin-top:12px}dialog{border:0;border-radius:12px;padding:18px;background:#f3f5f2;max-width:94vw;max-height:94vh}dialog::backdrop{background:#10251dcc}dialog img{width:auto;max-width:88vw;height:auto;max-height:80vh;cursor:default}dialog button{display:block;margin-left:auto;margin-bottom:12px}@media(max-width:700px){.pair{grid-template-columns:1fr 1fr}img{height:140px}}

main{max-width:1600px;padding-bottom:100px}#items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}article{min-width:0;margin:0;padding:12px}h2{font-size:14px}article .pair{gap:6px}article img{height:110px}article figcaption{font-size:11px}article p,article small{font-size:11px}article label{margin:6px 0}.bulk{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #bdcdc5;padding:12px 20px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:5}.bulk label{margin:0}.bulk strong{min-width:95px}dialog .pair img{width:100%;max-width:100%;height:65vh;object-fit:contain}dialog{width:1200px}#confirm{width:440px}#confirm button{display:inline-block;margin:8px}button{padding:7px 12px}@media(max-width:1100px){#items{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){#items{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:0 10px 150px}article img{height:90px}dialog .pair img{height:40vh}.bulk{gap:6px}}
</style></head><body><header><small style="color:#d7bf83">INNO GROUP · PRIVATE REVIEW</small><h1>云端图片审核</h1><p>原图备份与处理结果存于私有云端；审核通过不会自动上线。</p></header><main><div class="stats" id="stats">正在读取云端记录…</div><div class="toolbar"><select id="filter" aria-label="审核状态"><option value="">全部状态</option><option value="pending_review" selected>待审核修复图</option><option value="needs_inspection">待检查原图</option><option value="approved">已通过</option><option value="rejected">已拒绝</option><option value="queued">排队中</option><option value="failed">处理失败</option><option value="capacity_blocked">容量不足</option></select><select id="pageSize" aria-label="每页数量"><option>20</option><option selected>50</option><option>100</option></select><button id="refresh">刷新</button><span id="message" role="status"></span></div><div id="items"></div><footer><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></footer></main>
<div class="bulk"><button id="selectPage" class="approve" title="选择当前页所有可审核图片">本页全选</button><strong id="selectedCount">已选 0 张</strong><button id="clear">取消全选</button><button id="batchReject">批量拒绝</button><button id="batchApprove" class="approve">批量通过</button><small>仅选择当前页；审核不会自动上线</small></div>
<dialog id="zoom"><button id="closeZoom">关闭</button><div class="toolbar"><button id="zoomPrev">← 上一张</button><span id="zoomTitle"></span><button id="zoomNext">下一张 →</button><button id="zoomSelect">选中 / 取消（空格）</button></div><div class="pair"><figure><figcaption>原图</figcaption><img id="zoomOriginal" alt="原图"></figure><figure><figcaption>处理结果</figcaption><img id="zoomImage" alt="处理结果"></figure></div></dialog>
<dialog id="confirm"><h2 id="confirmTitle"></h2><label><input id="ack" type="checkbox"><span id="ackText"></span></label><p id="saveError" class="error"></p><button id="cancel">取消</button><button id="save" disabled>确认这一批</button></dialog>
<script nonce="__TOKEN__">
const token='__TOKEN__';let offset=0;let busy=false;let items=[],selected=new Set(),zoomIndex=0,decision='';const $=id=>document.getElementById(id);const pageSize=()=>Number($('pageSize').value);const eligible=i=>['pending_review','needs_inspection','approved','rejected'].includes(i.status);
const labels={queued:'排队中',processing:'处理中',pending_review:'待审核修复图',needs_inspection:'待检查原图',approved:'已通过',rejected:'已拒绝',failed:'处理失败',capacity_blocked:'容量不足'};
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n;};
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw Error(result.error);return result;}
const size=n=>(n/1000000).toFixed(2)+' MB';
async function load(){if(busy)return;busy=true;updateSelection();document.getElementById('message').textContent='读取中…';try{const data=await api('/api/list',{offset,pageSize:pageSize(),status:$('filter').value});document.getElementById('stats').textContent=`云端私有桶 ${data.bucket} · 已预留 ${size(data.usedBytes)} / 试运行上限 ${size(data.budgetBytes)} · `+Object.entries(data.counts).map(([k,v])=>`${labels[k]||k} ${v}`).join(' / ');const target=document.getElementById('items');target.replaceChildren();items=data.items;selected.clear();for(const item of data.items){const card=el('article');const pick=el('input');pick.type='checkbox';pick.dataset.id=item.id;pick.disabled=!eligible(item);pick.setAttribute('aria-label','选择 '+(item.vehicle||item.id));pick.onchange=()=>{if(pick.checked)selected.add(item.id);else selected.delete(item.id);updateSelection();};card.append(pick);card.append(el('h2',item.vehicle||item.id),el('span',labels[item.status]||item.status,'badge'));const pair=el('div',null,'pair');for(const [title,url] of [['原图 · 云端备份',item.original_url],['处理结果 · 等待人工确认',item.candidate_url]]){const fig=el('figure');fig.append(el('figcaption',title));if(url){const img=el('img');img.src=url;img.alt=title;img.loading='lazy';img.tabIndex=0;img.title='点击查看大图';const open=()=>showZoom(items.indexOf(item));img.onclick=open;img.onkeydown=e=>{if(e.key==='Enter')open();};fig.append(img);}else fig.append(el('div',item.status==='needs_inspection'?'未匹配到已知水印，请人工检查；没有自动改图。':'尚无图片','placeholder'));pair.append(fig);}card.append(pair);if(item.detection?.format==='webp')card.append(el('p',`WebP · ${Math.round(item.candidate_bytes/1000)} KB · ${item.detection.detected?'已修补，待核对':'仅压缩，需检查水印'}`));if(item.detection?.outsideMaskUnchanged)card.append(el('p',`尺寸 ${item.detection.width} × ${item.detection.height} · 水印区域外像素校验通过`));card.append(el('small','水印下的画面由算法估补。请检查是否涉及车身、损伤、铭牌、文字；这类图片应拒绝自动处理。'));if(item.error)card.append(el('p',item.error,'error'));target.append(card);}if(!data.items.length)target.append(el('div','当前没有这一状态的图片。','empty'));document.getElementById('previous').disabled=offset===0;document.getElementById('next').disabled=offset+data.items.length >= (data.counts[$('filter').value] ?? Object.values(data.counts).reduce((a,b)=>a+b,0));document.getElementById('page').textContent=`第 ${offset/pageSize()+1} 页`;document.getElementById('message').textContent='已更新；图片链接有效期 10 分钟，过期请刷新。';}catch(e){document.getElementById('message').textContent=e.message;}finally{busy=false;updateSelection();}}

function updateSelection(){const chosen=items.filter(i=>selected.has(i.id));$('selectedCount').textContent=`已选 ${chosen.length} 张`;$('batchApprove').disabled=busy||!chosen.length||chosen.some(i=>!i.candidate_url);$('batchReject').disabled=busy||!chosen.length;const available=items.filter(eligible);$('selectPage').textContent=available.length&&chosen.length===available.length?'本页已全选':'本页全选';for(const box of document.querySelectorAll('[data-id]'))box.checked=selected.has(box.dataset.id);for(const id of ['filter','pageSize','refresh','selectPage','clear'])$(id).disabled=busy;}
$('selectPage').onclick=()=>{selected=new Set(items.filter(eligible).map(i=>i.id));updateSelection();};$('clear').onclick=()=>{selected.clear();updateSelection();};
function showZoom(index){zoomIndex=index;const item=items[index];$('zoomTitle').textContent=`${index+1}/${items.length} · ${item.vehicle||''}`;for(const [id,url] of [['zoomOriginal',item.original_url],['zoomImage',item.candidate_url]]){const img=$(id);if(url){img.src=url;img.hidden=false;}else{img.removeAttribute('src');img.hidden=true;}}$('zoomSelect').disabled=!eligible(item);$('zoomSelect').textContent=selected.has(item.id)?'已选中 · 点击取消（空格）':'选择此图（空格）';$('zoomPrev').disabled=index===0;$('zoomNext').disabled=index===items.length-1;if(!$('zoom').open)$('zoom').showModal();}
$('zoomPrev').onclick=()=>showZoom(zoomIndex-1);$('zoomNext').onclick=()=>showZoom(zoomIndex+1);$('zoomSelect').onclick=()=>{const id=items[zoomIndex].id;if(selected.has(id))selected.delete(id);else selected.add(id);updateSelection();showZoom(zoomIndex);};$('zoom').onkeydown=e=>{if(e.key==='ArrowLeft'&&zoomIndex>0){e.preventDefault();showZoom(zoomIndex-1);}if(e.key==='ArrowRight'&&zoomIndex<items.length-1){e.preventDefault();showZoom(zoomIndex+1);}if(e.code==='Space'){e.preventDefault();if(!$('zoomSelect').disabled)$('zoomSelect').click();}};
function confirmBatch(value){decision=value;$('confirmTitle').textContent=`${value==='approved'?'通过':'拒绝'}选中的 ${selected.size} 张图片？`;$('ackText').textContent=value==='approved'?'我已检查这一批结果，确认修复未影响车辆信息。':'确认拒绝这一批处理结果。';$('ack').checked=false;$('save').disabled=true;$('saveError').textContent='';$('confirm').showModal();}
$('batchApprove').onclick=()=>confirmBatch('approved');$('batchReject').onclick=()=>confirmBatch('rejected');$('ack').onchange=()=>{$('save').disabled=!$('ack').checked;};$('cancel').onclick=()=>$('confirm').close();$('save').onclick=async()=>{$('save').disabled=true;$('cancel').disabled=true;$('ack').disabled=true;try{const result=await api('/api/review-batch',{ids:[...selected],decision});$('confirm').close();offset=0;await load();$('message').textContent=`已保存 ${result.changed} 张，未发布到网站。`;}catch(e){$('saveError').textContent=e.message;}finally{$('save').disabled=!$('ack').checked;$('cancel').disabled=false;$('ack').disabled=false;}};
$('confirm').addEventListener('cancel',e=>{if($('ack').disabled)e.preventDefault();});$('pageSize').onchange=()=>{offset=0;load();};
document.getElementById('closeZoom').onclick=()=>document.getElementById('zoom').close();document.getElementById('refresh').onclick=load;document.getElementById('filter').onchange=()=>{offset=0;load();};document.getElementById('previous').onclick=()=>{if(busy)return;offset=Math.max(0,offset-pageSize());load();};document.getElementById('next').onclick=()=>{if(busy)return;offset+=pageSize();load();};load();
</script></body></html>
