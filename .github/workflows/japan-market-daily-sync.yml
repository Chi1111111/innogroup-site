name: Japan Market daily CARAPIS sync

on:
  workflow_dispatch:
  schedule:
    # 02:17 NZST / 03:17 NZDT. GitHub schedules use UTC.
    - cron: '17 14 * * *'

permissions:
  contents: write

concurrency:
  group: japan-market-carapis-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh vehicles and photo galleries
        id: collector
        env:
          CARAPIS_API_KEY: ${{ secrets.CARAPIS_API_KEY }}
          CARAPIS_SOURCE: carsensor
          CARAPIS_PAGE_SIZE: 100
          CARAPIS_CONCURRENCY: 2
          CARAPIS_DAILY_REQUEST_BUDGET: 100
          # Stop cleanly before the 30-minute job limit so reports and old inventory are preserved.
          CARAPIS_COLLECTION_TIMEOUT_MS: 1200000
          CARAPIS_REQUEST_TIMEOUT_MS: 20000
        run: node scripts/run-japan-market-sync.mjs

      - name: Record interrupted collection
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.collector.outcome }}
        run: node scripts/run-japan-market-sync.mjs --finalize

      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-market-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/data/japan-market/sync-history.json

      - name: Commit refreshed market data
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.collector.outcome }}
        shell: bash
        run: |
          if [ "$SYNC_OUTCOME" = "success" ]; then
            git add public/data/japan-market
          elif [ -f public/data/japan-market/sync-history.json ]; then
            git add public/data/japan-market/sync-history.json
          fi
          if git diff --cached --quiet; then
            echo "CARAPIS returned no data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Japan Market inventory"
          git push
