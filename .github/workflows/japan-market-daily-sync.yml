name: Japan Market daily Japan Cars sync

on:
  workflow_dispatch:
  # Online collection disabled; use the local collector.

permissions:
  contents: write

concurrency:
  group: japan-market-daily-sync
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.local-time.outputs.run }}
    steps:
      - id: local-time
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          expected='0 12 * * *'
          if [ "$(TZ=Pacific/Auckland date +%z)" = '+1300' ]; then expected='0 11 * * *'; fi
          if [ "$EVENT" = 'workflow_dispatch' ] || [ "$CRON" = "$expected" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
  sync:
    needs: schedule
    if: needs.schedule.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JAPAN_MARKET_COLLECTOR: japancars
      JAPANCARS_TARGET: 5000
      JAPANCARS_CONCURRENCY: 1
      JAPANCARS_REQUEST_GAP_MS: 3000
      JAPANCARS_TIMEOUT_MS: 13800000
      JAPANCARS_COOKIE: ${{ secrets.JAPANCARS_COOKIE }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install collector dependencies
        run: npm ci

      - name: Collect with shared cloud checkpoint and detailed reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/japan-market-cloud-runner.mjs
