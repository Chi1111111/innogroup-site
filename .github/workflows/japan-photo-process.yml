name: Process existing Japan photos
on:
  workflow_dispatch:
    inputs:
      import_snapshot:
        description: Register the existing committed inventory (no vehicle scraping)
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: japan-photo-process
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic photo tools
        run: pip install -r scripts/photo-review/requirements.txt
      - name: Configure scoped private storage access
        env:
          PHOTO_CONFIG: ${{ secrets.JAPAN_PHOTO_CONFIG }}
        run: |
          python - <<'PY'
          import os, json
          from pathlib import Path
          config = json.loads(os.environ['PHOTO_CONFIG'])
          target = Path(os.environ['RUNNER_TEMP']) / 'photo-config.json'
          target.write_text(json.dumps(config))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('JAPAN_MARKET_PHOTO_CONFIG=' + str(target) + '\n')
          PY
      - name: Register fixed inventory snapshot
        if: ${{ inputs.import_snapshot == true }}
        run: python scripts/photo-review/cloud_worker.py snapshot
      - name: Verify earlier stored candidates
        run: python scripts/photo-review/cloud_worker.py verify-existing
      - name: Clean approved originals after verifying candidates
        run: python scripts/photo-review/cloud_worker.py cleanup-approved
      - name: Process queued photos only
        run: python scripts/photo-review/cloud_worker.py work --limit 2000 --max-seconds 2400
      - name: Remove temporary configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/photo-config.json"
